# NeuraEvo — Render Blueprint (Infrastructure as Code).
# Docs: https://render.com/docs/blueprint-spec
#
# Provisions what NeuraEvo runs on Render: the FastAPI backend and its managed
# PostgreSQL database. The Next.js frontend is deployed to Vercel (recommended)
# or self-hosted from infrastructure/docker/frontend.Dockerfile — see
# docs/deployment.md. This file is the Render half of a split deployment.
#
# Launch: connect the repo in the Render dashboard ("New > Blueprint"), or
#   `render blueprint launch`. Secrets are NEVER stored here — only variable
# names are declared; values are generated by Render or set in the dashboard.

databases:
  - name: neuraevo-db
    databaseName: neuraevo

    # FREE PostgreSQL for V1 testing.
    # Note: Render Free Postgres has 1 GB storage and expires 30 days
    # after creation. Upgrade before expiration if data must be preserved.
    plan: free

    postgresMajorVersion: "18"
    region: singapore

    # Reachable only from Render services in this account; no public ingress.
    ipAllowList: []

services:
  - type: web
    name: neuraevo-api
    runtime: docker
    region: singapore

    # FREE web service for V1 testing.
    # Free services spin down after 15 minutes of inactivity and may take
    # about a minute to wake up.
    plan: free

    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: ./backend

    # SINGLE INSTANCE on purpose.
    # The auth/AI rate limiter and workflow runtime hold per-process
    # in-memory state, so horizontal scaling or multiple workers would
    # split that state.
    numInstances: 1

    # Constant-time liveness endpoint.
    healthCheckPath: /api/v1/health

    autoDeploy: true

    envVars:
      # Injected from the managed database above.
      # Arrives as postgresql://…; the container entrypoint rewrites the
      # scheme to postgresql+psycopg:// before the app or Alembic reads it.
      - key: DATABASE_URL
        fromDatabase:
          name: neuraevo-db
          property: connectionString

      # Production security settings.
      - key: ENVIRONMENT
        value: production

      # Strong secret generated by Render.
      - key: JWT_SECRET_KEY
        generateValue: true

      # REQUIRED in production.
      # Set this to your Vercel frontend URL, for example:
      # https://neuraevo.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # REQUIRED for AI features.
      # Set manually in Render Dashboard. Never commit the key.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Public frontend URL.
      - key: FRONTEND_BASE_URL
        sync: false