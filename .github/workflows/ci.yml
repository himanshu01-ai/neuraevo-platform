name: CI

# Validates every push and pull request: backend tests, frontend checks, and
# that both production Docker images build. Runtimes match what ships —
# Python 3.12 (backend image) and Node 22 (frontend, package.json engines).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: neuraevo_test
          POSTGRES_USER: neuraevo_test
          POSTGRES_PASSWORD: neuraevo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuraevo_test -d neuraevo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite (stdlib unittest)
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Apply migrations for isolated PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql+psycopg://neuraevo_test:neuraevo_test@127.0.0.1:5432/neuraevo_test
          PYTHONPATH: .
        run: python -m alembic upgrade head
      - name: Verify persisted conversation turn against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://neuraevo_test:neuraevo_test@127.0.0.1:5432/neuraevo_test
          NEURAEVO_POSTGRES_INTEGRATION: "1"
          PYTHONPATH: .
        run: python -m unittest tests.test_conversation_postgres_integration

  frontend-checks:
    name: Frontend typecheck, lint, test, build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        # NEXT_PUBLIC_* are inlined at build time; lib/env.ts requires a URL.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infrastructure/docker/backend.Dockerfile
          push: false
          load: true
          tags: neuraevo-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./infrastructure/docker/frontend.Dockerfile
          push: false
          load: true
          tags: neuraevo-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.com/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
