# NeuraEvo — Render Blueprint (Infrastructure as Code).
# Docs: https://render.com/docs/blueprint-spec
#
# Provisions what NeuraEvo runs on Render: the FastAPI backend and its managed
# PostgreSQL database. The Next.js frontend is deployed to Vercel (recommended)
# or self-hosted from infrastructure/docker/frontend.Dockerfile — see
# docs/deployment.md. This file is the Render half of a split deployment.
#
# Launch: connect the repo in the Render dashboard ("New > Blueprint"), or
#   `render blueprint launch`. Secrets are NEVER stored here — only variable
#   names are declared; values are generated by Render or set in the dashboard.

databases:
  - name: neuraevo-db
    databaseName: neuraevo
    # Smallest paid Postgres tier — raise for production load. Verify the exact
    # plan slug against current Render plans before launch (they change over time).
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon
    # Reachable only from Render services in this account; no public ingress.
    ipAllowList: []

services:
  - type: web
    name: neuraevo-api
    runtime: docker
    region: oregon
    # Always-on (no cold starts), appropriate for an API. Raise as needed.
    plan: starter
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: ./backend
    # SINGLE INSTANCE on purpose. The auth/AI rate limiter and the workflow
    # runtime hold per-process in-memory state, so horizontal scaling (or
    # multiple uvicorn workers) would split that state. Scale up, not out, until
    # that state is externalised. See docs/deployment.md.
    numInstances: 1
    # Constant-time liveness endpoint (app/api/v1/health.py).
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Injected from the managed database above. Arrives as postgresql://…; the
      # container entrypoint rewrites the scheme to postgresql+psycopg:// (the
      # installed driver) before the app or Alembic read it.
      - key: DATABASE_URL
        fromDatabase:
          name: neuraevo-db
          property: connectionString
      # Enables the production security gates (explicit CORS, secure JWT, HSTS).
      - key: ENVIRONMENT
        value: production
      # Strong secret generated once by Render and kept in its secret store.
      - key: JWT_SECRET_KEY
        generateValue: true
      # REQUIRED in production: the app refuses to boot with a wildcard CORS
      # origin. Set to the frontend origin(s), comma-separated,
      # e.g. https://app.neuraevo.com
      - key: CORS_ORIGINS
        sync: false
      # REQUIRED for AI features. Set in the dashboard; never commit a key.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Public frontend base URL, used to build links in verification/reset email.
      - key: FRONTEND_BASE_URL
        sync: false
