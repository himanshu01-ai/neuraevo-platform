<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100" fill="none" role="img" aria-label="NeuraEvo">
  <!--
    Horizontal lockup: the official NeuraEvo mark + the product name set in the
    brand typeface (Inter). Theme-adaptive: the mark's N-structure and the text
    use currentColor (inherit text-foreground); the diagonal node chain keeps the
    brand violet, which reads on both light and dark. The mark artwork is the
    official geometry, unmodified — only the structure color is parameterized.
  -->
  <g fill="none">
    <line x1="28" y1="26" x2="28" y2="74" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></line>
    <line x1="72" y1="26" x2="72" y2="74" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></line>
    <circle cx="72" cy="26" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
    <circle cx="28" cy="74" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
    <line x1="28" y1="26" x2="72" y2="74" stroke="#6c5cf2" stroke-width="7" stroke-linecap="round" opacity="0.14"></line>
    <line x1="28" y1="26" x2="72" y2="74" stroke="#6c5cf2" stroke-width="1.8" stroke-linecap="round" opacity="0.55"></line>
    <circle cx="28" cy="26" r="2.6" fill="#6c5cf2"></circle>
    <circle cx="39" cy="38" r="3.7" fill="#6c5cf2"></circle>
    <circle cx="50" cy="50" r="5" fill="#6c5cf2"></circle>
    <circle cx="61" cy="62" r="6.4" fill="#6c5cf2"></circle>
    <circle cx="72" cy="74" r="13" fill="#8f80ff" opacity="0.16"></circle>
    <circle cx="72" cy="74" r="8.4" fill="#8f80ff"></circle>
  </g>
  <text x="104" y="63" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="600" letter-spacing="-0.6" fill="currentColor">NeuraEvo</text>
</svg>
